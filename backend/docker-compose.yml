# Local dev only: brings up Postgres + Redis so `mvn spring-boot:run` has
# something to talk to. Render/Neon/Upstash replace these in production —
# there is no "app" service here because there's no separate frontend
# container to run alongside it (that's the whole point of the Vaadin pivot).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ticketbooking
      POSTGRES_USER: ticketbooking
      POSTGRES_PASSWORD: ticketbooking
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketbooking"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
