name: CI
on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Build and test (Testcontainers needs Docker, available by default on ubuntu-latest runners)
        working-directory: backend
        run: mvn -B verify
